# Optional Render Blueprint - lets you deploy the backend with one click
# via https://render.com/docs/blueprint-spec. Not required: you can also
# just create a Web Service manually in the Render dashboard (see README).
services:
  - type: web
    name: trustnet-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: trustnet-data
      mountPath: /var/data
      sizeGB: 1
